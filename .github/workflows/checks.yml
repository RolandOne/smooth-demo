name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: node --test skills/smooth-demo/scripts/tests/capture.test.mjs
      - run: python skills/smooth-demo/scripts/tests/motion_test.py
      - run: python -m compileall -q skills/smooth-demo/scripts
